# Metaspace e class space subiram de 256m/96m: com firebase_auth e google_sign_in
# no grafo, o compilador Kotlin rodando in-process não cabia mais em 256m e o
# build falhava em :google_sign_in_android:compileDebugKotlin com "Metaspace".
# O heap segue em 768m — não foi ele que estourou.
# Heap subiu de 768m para 2g: o R8 roda como worker do Gradle e, com
# workers.max=1, herda esta JVM. Minificar um app com o Firebase inteiro em 768m
# falhava em :app:minifyDevReleaseWithR8 com "Compilation failed to complete",
# depois de ~12 min. A máquina tem 30 GB — o limite anterior era herança, não
# necessidade. Um CI mais apertado pode sobrescrever via GRADLE_OPTS.
org.gradle.jvmargs=-Xmx2g -Xss384k -XX:MaxMetaspaceSize=512m -XX:CompressedClassSpaceSize=256m -XX:ReservedCodeCacheSize=96m -XX:ActiveProcessorCount=2 -XX:CICompilerCount=2 -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
